services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: flood
      POSTGRES_USER: flood
      POSTGRES_PASSWORD: flood_local
    volumes:
      - flood_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flood -d flood"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgres://flood:flood_local@db:5432/flood?sslmode=disable
      PORT: "8080"
      THAIWATER_URL: ${THAIWATER_URL:-https://api-v3.thaiwater.net/api/v1/thaiwater30/public/waterlevel_load}
      THAIWATER_GRAPH_URL: ${THAIWATER_GRAPH_URL:-https://api-v3.thaiwater.net/api/v1/thaiwater30/public/waterlevel_graph}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
  forecast:
    build: ./forecast
    environment:
      DATABASE_URL: postgres://flood:flood_local@db:5432/flood?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
  web:
    build: ./front-end
    ports:
      - "5173:5173"
    depends_on:
      - api
volumes:
  flood_db:

